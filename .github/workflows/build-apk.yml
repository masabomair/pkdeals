name: Build Android APK

# Runs only when asked: Actions tab -> "Build Android APK" -> Run workflow,
# or by pushing to the "apk-build" branch.
on:
  workflow_dispatch:
  push:
    branches: [apk-build, apk-test]   # apk-test builds without publishing a release

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use the permanent signing key (if its secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent release key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with a temporary debug key"
          fi
      - env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=DATA_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../SaleMela.apk
      - uses: actions/upload-artifact@v7
        with:
          name: SaleMela-apk
          path: SaleMela.apk
      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/apk-build' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sale Mela build ${{ github.run_number }}
          files: SaleMela.apk
