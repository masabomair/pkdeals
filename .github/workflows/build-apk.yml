name: Build Android APK

# Runs only when asked: Actions tab -> "Build Android APK" -> Run workflow,
# or by pushing a tag that starts with "apk-" (e.g. apk-1).
on:
  workflow_dispatch:
  push:
    tags: ["apk-*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=DATA_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../SaleWala.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SaleWala-apk
          path: SaleWala.apk
      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sale Wala build ${{ github.run_number }}
          files: SaleWala.apk
