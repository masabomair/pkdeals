name: Build Android APK

# Runs only when asked: Actions tab -> "Build Android APK" -> Run workflow,
# or by pushing to the "apk-build" branch.
on:
  workflow_dispatch:
  push:
    branches: [apk-build, apk-test, play-build]   # apk-test: no release; play-build: also the Play bundle

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use the permanent signing key (if its secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent release key"
            # safe diagnostics: a short fingerprint of the key file and the
            # lengths of the secrets, never their values
            echo "key file fingerprint: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-16)"
            echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
            echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}  KEY_PASSWORD length: ${#KEY_PASSWORD}  KEY_ALIAS length: ${#KEY_ALIAS}"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; signing with a temporary debug key"
          fi
      - env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=DATA_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
      # the Play Store only accepts app bundles (.aab), signed with the same key
      - if: github.ref == 'refs/heads/play-build'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=DATA_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
      - name: Rename APK and bundle
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../SaleMela.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then cp build/app/outputs/bundle/release/app-release.aab ../SaleMela.aab; fi
      - uses: actions/upload-artifact@v7
        with:
          name: SaleMela-apk
          if-no-files-found: ignore
          path: |
            SaleMela.apk
            SaleMela.aab
      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/apk-build' || github.ref == 'refs/heads/play-build' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sale Mela build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            SaleMela.apk
            SaleMela.aab
