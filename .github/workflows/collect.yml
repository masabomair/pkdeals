name: Collect deals

# Every hour: read all brands' sale prices and publish them to GitHub Pages.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "docs/**", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy_try1.outputs.page_url || steps.deploy_try2.outputs.page_url || steps.deploy_try3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Data is not committed to git (it would bloat the repo); the previous
      # run's files are fetched from the live site so a brand that fails today
      # keeps yesterday's deals and sale start dates are remembered.
      - name: Restore previous data
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          mkdir -p docs/data/deals
          curl -fsSL "$base/brands.json" -o docs/data/brands.json || rm -f docs/data/brands.json
          for id in $(python3 -c "import json;print(' '.join(b['id'] for b in json.load(open('collector/brands.json'))))"); do
            curl -fsSL "$base/deals/$id.json" -o "docs/data/deals/$id.json" || rm -f "docs/data/deals/$id.json"
            mkdir -p docs/data/logos
            curl -fsSL "$base/logos/$id.png" -o "docs/data/logos/$id.png" || rm -f "docs/data/logos/$id.png"
          done

      - name: Collect
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 collector/collect.py

      # each brand's small icon for the circles in the app (keeps last
      # run's icon when a site can't be read)
      - name: Brand icons
        continue-on-error: true
        run: |
          sudo apt-get install -y -q libcairo2 >/dev/null 2>&1 || true
          pip install -q pillow cairosvg
          python3 collector/logos.py

      # push notifications for sales that started or got bigger (does
      # nothing until the FIREBASE_SERVICE_ACCOUNT secret is set)
      - name: Send push alerts
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q -r collector/requirements.txt
          python3 collector/push_alerts.py --full docs/data/brands.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # GitHub sometimes can't find the just-uploaded artifact for a few
      # seconds ("No artifacts named github-pages"); wait and retry.
      - id: deploy_try1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy_try1.outcome == 'failure'
        run: sleep 60
      - id: deploy_try2
        if: steps.deploy_try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy_try1.outcome == 'failure' && steps.deploy_try2.outcome == 'failure'
        run: sleep 120
      - id: deploy_try3
        if: steps.deploy_try1.outcome == 'failure' && steps.deploy_try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
